name: treinos
services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    networks: [web]
    logging: &logging
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  app:
    build: ./backend
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Configure .env}
      MYSQL_USER: ${MYSQL_USER:?Configure .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure .env}
      SECRET_KEY: ${SECRET_KEY:?Configure .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TZ: America/Sao_Paulo
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_FREE_PROJECT_CONFIRMED: ${GEMINI_FREE_PROJECT_CONFIRMED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 100
    read_only: true
    tmpfs: [/tmp]
    networks: [web, database]
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 6
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Configure .env}
      MYSQL_USER: ${MYSQL_USER:?Configure .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure .env}
      TZ: America/Sao_Paulo
    command: ["--innodb-buffer-pool-size=256M", "--max-connections=30", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: ["mysql_data:/var/lib/mysql"]
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 200
    networks: [database]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
networks:
  web:
  database:
    internal: true
volumes:
  mysql_data:
