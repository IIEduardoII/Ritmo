worker_processes 1;
pid /data/data/com.termux/files/home/.local/share/ritmo/nginx.pid;
error_log stderr warn;

events { worker_connections 128; }

http {
    include /data/data/com.termux/files/usr/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /data/data/com.termux/files/home/.local/share/ritmo/nginx-access.log;
    sendfile on;

    # v1.2.0: HTTP em 8088 (loopback 127.0.0.1 é contexto seguro; Tailscale para os demais).
    server {
        listen 0.0.0.0:8088;
        server_name _;
        include /data/data/com.termux/files/home/ritmo-termux/nginx-ritmo-common.conf;
    }

    # v1.3.0: HTTPS em 8443 com a CA local do Ritmo (restrita a este aparelho). Necessário para
    # instalar o PWA e receber Web Push em outros aparelhos da tailnet.
    server {
        listen 0.0.0.0:8443 ssl;
        http2 on;
        server_name _;
        ssl_certificate     /data/data/com.termux/files/home/ritmo-termux/certs/server.crt;
        ssl_certificate_key /data/data/com.termux/files/home/ritmo-termux/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ritmo:1m;
        ssl_session_timeout 1h;
        include /data/data/com.termux/files/home/ritmo-termux/nginx-ritmo-common.conf;
    }
}
