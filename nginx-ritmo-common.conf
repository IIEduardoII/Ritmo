root /data/data/com.termux/files/home/ritmo-termux/frontend;
index index.html;
client_max_body_size 256k;

# Somente o próprio aparelho (127.0.0.1) e a rede privada Tailscale.
allow 127.0.0.1;
allow 100.64.0.0/10;
deny all;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Cache-Control "no-store" always;

location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
}
# Certificado PÚBLICO da CA local, para instalar no celular (a chave privada nunca fica aqui).
location = /ritmo-ca.crt {
    default_type application/x-x509-ca-cert;
    try_files $uri =404;
}
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location / { try_files $uri $uri/ /index.html; }
